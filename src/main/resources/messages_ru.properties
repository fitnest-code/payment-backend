error.validation = Произошла ошибка при проверке данных
error.invalid_field = Предоставленные данные недействительны
error.missing_field = Необходимая информация не была предоставлена
error.out_of_range = Указанное значение выходит за допустимый диапазон
error.invalid_format = Неверный формат данных

error.unauthorized = Пожалуйста, войдите в систему для продолжения
error.invalid_credentials = Неверные учетные данные для входа
error.token_expired = Срок действия сессии истек. Пожалуйста, войдите снова
error.account_locked = Доступ к учетной записи временно ограничен
error.account_disabled = Учетная запись в настоящее время неактивна

error.forbidden = У вас нет разрешения на выполнение этого действия
error.access_denied = Доступ запрещен

error.invalid_request = Неверный запрос
error.invalid_json_format = Неверный формат JSON
error.unsupported_media_type = Неподдерживаемый тип медиа
error.method_not_allowed = Этот метод HTTP не поддерживается

error.internal_server_error = Произошла техническая ошибка. Пожалуйста, попробуйте позже
error.service_unavailable = Сервис в настоящее время недоступен
error.unexpected = Произошла непредвиденная ошибка

error.resource_not_found = Запрашиваемая информация не найдена
error.resource_already_exists = Эта информация уже существует
error.resource_conflict = Обнаружен конфликт данных

error.too_many_requests = Отправлено слишком много запросов. Пожалуйста, подождите
error.rate_limit_exceeded = Превышен лимит запросов

# Service Specific Errors
error.payment_failed = Транзакция не удалась
error.insufficient_funds = Недостаточно средств на балансе
error.invalid_card = Неверные данные карты
error.card_expired = Срок действия карты истек
error.transaction_not_found = Транзакция не найдена
error.refund_failed = Ошибка при возврате средств
error.invalid_currency = Неподдерживаемая валюта

error.payment_encoding_failed = Ошибка кодирования при обработке платежа
error.payment_crypto_error = Криптографическая ошибка при обработке платежа
error.payment_decoding_failed = Ошибка декодирования при обработке платежа
