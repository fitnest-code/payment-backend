server:
  port: 8080
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,application/javascript,application/openapi+json,application/vnd.api+json
    min-response-size: 2048
  tomcat:
    threads:
      max: 200
      min-spare: 20
    connection-timeout: 20000
    max-connections: 10000
    accept-count: 200

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: payment-service
  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:false}
  messages:
    encoding: UTF-8
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresql-payment:5432/fitnest_payment}
    username: ${SPRING_DATASOURCE_USERNAME:fitnest_payment}
    password: ${SPRING_DATASOURCE_PASSWORD:payment_password_123}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keep-alive-time: 300000
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      maximum-pool-size: ${HIKARI_MAX_POOL:15}
      pool-name: HikariCP-Payment
      auto-commit: true
      connection-test-query: SELECT 1
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
  jackson:
    default-property-inclusion: NON_NULL
    time-zone: UTC

  # Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis.fitnest-dev.svc.cluster.local}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-service.fitnest-dev.svc.cluster.local:9092}
    consumer:
      group-id: payment-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
          pool:
            max-connections: ${FEIGN_MAX_CONNECTIONS:50}
            max-connections-per-route: ${FEIGN_CONNECTIONS_PER_ROUTE:20}
            conn-pool-policy: LIFO
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:5000}
            read-timeout: ${FEIGN_READ_TIMEOUT:10000}
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: BASIC

eureka:
  client:
    enabled: false

jwt:
  secret: ${JWT_SECRET:your-jwt-secret-change-in-production}
  issuer: ${JWT_ISSUER:fitnest}

# Service URLs
iam:
  service:
    url: ${IDENTITY_SERVICE_URL:http://identity-service:8080}

user:
  service:
    url: ${USER_SERVICE_URL:http://user-service:8080}

media:
  service:
    url: ${STORAGE_SERVICE_URL:http://storage-service:8080}

app:
  security:
    internal-token: ${APP_SECURITY_INTERNAL_TOKEN:fitnest-internal-token-2024-secure-v1}
  warmup:
    enabled: ${APP_WARMUP_ENABLED:true}
    db: ${APP_WARMUP_DB:true}

# Epoint Configuration
epoint:
  public-key: ${EPOINT_PUBLIC_KEY:}
  private-key: ${EPOINT_PRIVATE_KEY:}
  base-url: ${EPOINT_BASE_URL:https://epoint.az/api/1}
  result-url: ${EPOINT_RESULT_URL:https://dev-api.fitnest.az/payment/callback}
  success-redirect-url: ${EPOINT_SUCCESS_REDIRECT_URL:https://fitnest.az/payment/success}
  error-redirect-url: ${EPOINT_ERROR_REDIRECT_URL:https://fitnest.az/payment/error}

# Idempotency Key Configuration
payment:
  idempotency:
    # Time To Live for idempotency keys in hours
    # Standard: 24 hours (Stripe, Square, PayPal use this)
    # Options: 1, 6, 12, 24, 48 hours
    ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}

    # Cleanup schedule (cron expression)
    # Default: Every hour at minute 0 (0 0 * * * *)
    # Format: second minute hour day month weekday
    # Examples:
    #  - "0 0 * * * *" → Every hour
    #  - "0 */30 * * * *" → Every 30 minutes
    #  - "0 0 2 * * *" → Daily at 2:00 AM
    cleanup-cron: ${IDEMPOTENCY_CLEANUP_CRON:0 0 * * * *}

    # Maximum number of idempotency keys to keep in database
    # Recommendations:
    #  - 100,000: Small/medium systems (100-1000 tx/day)
    #  - 500,000: Medium/large systems (1000-10,000 tx/day)
    #  - 1,000,000: Large systems (10,000+ tx/day)
    max-entries: ${IDEMPOTENCY_MAX_ENTRIES:100000}

    # Enable Redis caching for idempotency keys
    # true: Better performance, reduces DB load (recommended for production)
    # false: Simpler setup, no Redis dependency
    redis-enabled: ${IDEMPOTENCY_REDIS_ENABLED:true}

    # Redis TTL in seconds (should be ≤ ttl-hours * 3600)
    # Default: 86400 seconds (24 hours)
    redis-ttl-seconds: ${IDEMPOTENCY_REDIS_TTL_SECONDS:86400}

    # Enable logging for cleanup operations
    cleanup-logging-enabled: ${IDEMPOTENCY_CLEANUP_LOGGING_ENABLED:true}

    # Enable detailed logging for cache hits/misses (set to true for debugging)
    detailed-logging-enabled: ${IDEMPOTENCY_DETAILED_LOGGING_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    cache:
      enabled: true
    pre-loading-enabled: true
  paths-to-exclude: /api/v1/internal/**
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    doc-expansion: none
    filter: true
    display-request-duration: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: false


grpc:
  server:
    port: 9091

logging:
  level:
    root: INFO
    com.fitnest: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

payment:
  idempotency:
    detailed-logging-enabled: true
