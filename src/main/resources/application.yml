server:
  port: 8080
  forward-headers-strategy: framework
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,application/javascript,application/openapi+json,application/vnd.api+json
    min-response-size: 2048
  tomcat:
    threads:
      max: 200
      min-spare: 20
    connection-timeout: 20000
    max-connections: 10000
    accept-count: 200

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: payment-backend   # ✅ Changed from payment-service
  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:false}
    allow-bean-definition-overriding: true
  messages:
    encoding: UTF-8
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresql-payment:5432/fitnest_payment}
    username: ${SPRING_DATASOURCE_USERNAME:fitnest_payment}
    password: ${SPRING_DATASOURCE_PASSWORD:payment_password_123}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HikariCP-Payment
      maximum-pool-size: ${HIKARI_MAX_POOL:15}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      leak-detection-threshold: 30000
      connection-timeout: 20000
      idle-timeout: 30000
      max-lifetime: 1800000
      keep-alive-time: 60000
      auto-commit: false
      data-source-properties:
        reWriteBatchedInserts: true
        prepareThreshold: 5
        preparedStatementCacheQueries: 250
        preparedStatementCacheSizeMiB: 10
        tcpKeepAlive: true
        binaryTransfer: true
        socketTimeout: 30
        connectTimeout: 10
        loginTimeout: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        generate_statistics: false
        connection:
          provider_disables_autocommit: true
  jackson:
    default-property-inclusion: NON_NULL
    time-zone: UTC

  # Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis.fitnest-production.svc.cluster.local}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms

      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: 2000ms
        shutdown-timeout: 100ms
  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-service.fitnest-production.svc.cluster.local:9092}
    consumer:
      group-id: payment-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
          pool:
            max-connections: ${FEIGN_MAX_CONNECTIONS:50}
            max-connections-per-route: ${FEIGN_CONNECTIONS_PER_ROUTE:20}
            conn-pool-policy: LIFO
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:5000}
            read-timeout: ${FEIGN_READ_TIMEOUT:10000}
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: BASIC

eureka:
  client:
    enabled: false

jwt:
  secret: ${JWT_SECRET:your-jwt-secret-change-in-production}
  issuer: ${JWT_ISSUER:fitnest}

# ✅ Updated service URLs
iam:
  backend:
    url: ${IDENTITY_BACKEND_URL:http://identity-backend:8080}

user:
  backend:
    url: ${USER_BACKEND_URL:http://user-backend:8080}

media:
  backend:
    url: ${STORAGE_BACKEND_URL:http://storage-backend:8080}

app:
  security:
    internal-token: ${APP_SECURITY_INTERNAL_TOKEN:fitnest-internal-token-2024-secure-v1}
  warmup:
    enabled: ${APP_WARMUP_ENABLED:true}
    db: ${APP_WARMUP_DB:true}

# Epoint Configuration
epoint:
  public-key: ${EPOINT_PUBLIC_KEY:}
  private-key: ${EPOINT_PRIVATE_KEY:}
  base-url: ${EPOINT_BASE_URL:https://epoint.az/api/1}
  result-url: ${EPOINT_RESULT_URL:https://api.fitnest.az/payment/callback}
  success-redirect-url: ${EPOINT_SUCCESS_REDIRECT_URL:https://fitnest.az/payment/success}
  error-redirect-url: ${EPOINT_ERROR_REDIRECT_URL:https://fitnest.az/payment/error}

# ABB (Azericard) E-Commerce Gateway Configuration
abb:
  # Sandbox: https://testmpi.3dsecure.az/cgi-bin/cgi_link
  # Production: https://mpi.3dsecure.az/cgi-bin/cgi_link
  gateway-url: ${ABB_GATEWAY_URL:https://testmpi.3dsecure.az/cgi-bin/cgi_link}
  terminal-id: ${ABB_TERMINAL_ID:}
  merchant-name: ${ABB_MERCHANT_NAME:FitNest}
  merchant-url: ${ABB_MERCHANT_URL:https://fitnest.az}
  merchant-email: ${ABB_MERCHANT_EMAIL:payment@fitnest.az}
  country-code: ${ABB_COUNTRY_CODE:AZ}
  merchant-gmt: ${ABB_MERCHANT_GMT:+4}
  # RSA private key (PKCS#8, Base64, PEM headers optional)
  private-key: ${ABB_PRIVATE_KEY:}
  # Azericard public key for P_SIGN verification (AZERICARDpublic.pem, Base64)
  public-key: ${ABB_PUBLIC_KEY:}
  callback-url: ${ABB_CALLBACK_URL:https://dev-api.fitnest.az/payment/abb/callback}
  success-redirect-url: ${ABB_SUCCESS_REDIRECT_URL:https://fitnest.az/payment/success}
  error-redirect-url: ${ABB_ERROR_REDIRECT_URL:https://fitnest.az/payment/error}
  default-currency: ${ABB_DEFAULT_CURRENCY:AZN}
  default-language: ${ABB_DEFAULT_LANGUAGE:AZ}

# Idempotency Key Configuration
payment:
  idempotency:
    ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}
    cleanup-cron: ${IDEMPOTENCY_CLEANUP_CRON:0 0 * * * *}
    max-entries: ${IDEMPOTENCY_MAX_ENTRIES:100000}
    redis-enabled: ${IDEMPOTENCY_REDIS_ENABLED:true}
    redis-ttl-seconds: ${IDEMPOTENCY_REDIS_TTL_SECONDS:86400}
    cleanup-logging-enabled: ${IDEMPOTENCY_CLEANUP_LOGGING_ENABLED:true}
    detailed-logging-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  server-url: ${SPRINGDOC_SERVER_URL:https://api.fitnest.az}
  api-docs:
    path: /v3/api-docs
    cache:
      enabled: true
    pre-loading-enabled: true
  paths-to-exclude: /api/v1/internal/**
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    doc-expansion: none
    filter: true
    display-request-duration: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: false

grpc:
  server:
    port: 9090
  client:
    # ✅ Updated gRPC client from order-service to order-backend
    order-backend:
      address: 'dns:///order-backend.fitnest-production.svc.cluster.local:9090'
      negotiation-type: plaintext
    user-backend:
      address: 'dns:///user-backend.fitnest-production.svc.cluster.local:9090'
      negotiation-type: plaintext

logging:
  level:
    root: INFO
    com.fitnest: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    az.fitnest.payment: DEBUG
  file:
    name: logs/payment-backend.log   # ✅ Updated log file name